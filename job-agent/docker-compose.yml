version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    volumes:
      - db_data:/app/job_agent.db
      - uploads_data:/app/backend/uploads
      - logs_data:/app/backend/logs
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  db_data:
  uploads_data:
  logs_data:
